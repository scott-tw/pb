<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>校園點數銀行</title>
<!-- 點數卡短網址轉址頁：只把合格的卡片代碼（12 碼，無 0 1 I L O）轉到學校系統，不收集任何資料 -->
<script>
(function () {
  var APP = 'https://script.google.com/macros/s/AKfycbzMd88CNUlmotpBvWcKBGiLUavA6ExPa9esKmLd2raa5lHRLQ8DtJOWq37LYYvsAGBs/exec';
  var m = location.search.match(/[?&]k=([23456789ABCDEFGHJKMNPQRSTUVWXYZ]{12})(?:&|$)/i);
  location.replace(APP + (m ? '?k=' + m[1].toUpperCase() : ''));
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>正在開啟校園點數銀行…（請用學校帳號登入）</p>
</body>
</html>
