<script>
var ACT = null, TAB = '', VCACHE = {};
var STATE_BADGE = { '完成': 'ok', '待補文字': 'wait', '隱藏': 'hid' };
var SIX = [['when', '何時'], ['where', '何地'], ['who', '何人'], ['what', '何事'], ['why', '為何'], ['how', '如何'], ['find', '我的發現']];

function gasP(fn, args) { return new Promise(function (ok, fail) { api(fn, args, ok, function (m) { fail(new Error(m)); }); }); }

// ---------- 進入活動 ----------
function openAct(id, tab) {
  $('busy').style.display = 'block';
  api('getActivity', [TOKEN, id], function (d) {
    ACT = d; TAB = tab || TAB || 'it';
    $('home').classList.add('hidden'); $('mine').classList.add('hidden'); $('actView').classList.remove('hidden');
    drawAct(); window.scrollTo(0, 0);
  }, function (m) { alert(m); });
}
function closeAct() {
  ACT = null; TAB = ''; $('actView').classList.add('hidden'); $('actView').innerHTML = '';
  $('home').classList.remove('hidden'); $('mine').classList.remove('hidden');
}
function reloadAct() { if (ACT) openAct(ACT.act.id, TAB); }
function drawAct() {
  var a = ACT.act, r = ACT.role;
  var tabs = [['it', '行程']];
  if (r === 's') tabs.push(['w', '我的作業']);
  if (r === 'p') tabs.push(['w', '孩子的作業']);
  if (r === 't') tabs.push(['st', '繳交情形']);
  tabs.push(['al', '活動相簿']);
  tabs.push(['v', '影片']);
  var h = '<div class="rolebar"><button onclick="closeAct()">← 返回</button><b>' + esc(a.name) + '</b></div>' +
    '<div class="muted" style="margin:-6px 0 10px">' + esc(a.year) + ' 學年度｜' + esc(a.mode) + '交流｜' + esc(a.start) + '～' + esc(a.end) +
    (ACT.group ? '｜第 ' + esc(ACT.group) + ' 組' : '') + (ACT.teacherRole ? '｜' + esc(ACT.teacherRole) : '') +
    (r === 's' ? (ACT.canUpload ? (a.uploadUntil ? '｜上傳到 ' + esc(a.uploadUntil) : '') : '｜<b>目前不能上傳</b>') : '') + '</div>' +
    '<div class="tabs">' + tabs.map(function (t) { return '<button class="' + (t[0] === TAB ? 'on' : '') + '" onclick="TAB=\'' + t[0] + '\';drawAct()">' + t[1] + '</button>'; }).join('') + '</div><div id="tabBody"></div>';
  $('actView').innerHTML = h;
  ({ it: drawItin, w: drawWorks, st: drawStats, al: drawAlbum, v: drawVideos })[TAB]();
  loadViews();
}
function byDay(list) { var d = {}; list.forEach(function (x) { (d[x.day] = d[x.day] || []).push(x); }); return d; }
function taskOf(id) { return ACT.itinerary.filter(function (t) { return t.id === id; })[0] || { id: id, name: '', spot: '', day: 0, hints: {} }; }
function taskTitle(t) { return [t.slot, t.spot, t.name].filter(String).join('｜') || '（未命名）'; }
function worksFor(taskId) { return (ACT.works || []).filter(function (w) { return w.taskId === taskId; }); }

// ---------- 行程 ----------
function drawItin() {
  if (!ACT.itinerary.length) { $('tabBody').innerHTML = '<div class="card muted">行程還沒有排好。</div>'; return; }
  var d = byDay(ACT.itinerary), h = '';
  Object.keys(d).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) {
    var first = d[k][0];
    h += '<div class="dayh">第 ' + k + ' 天' + (first.date ? '｜' + esc(first.date) : '') + '</div>';
    d[k].forEach(function (t) {
      var lodging = t.slot === '住宿';
      var mine = worksFor(t.id);
      h += '<div class="task"><div class="tt"><div><b>' + esc(taskTitle(t)) + '</b>' + (t.required ? '<span class="badge req">必交</span>' : '') +
        (t.type ? '<span class="badge">' + esc(t.type) + '</span>' : '') +
        '<div class="meta">' + esc([t.city, t.lodging ? '住：' + t.lodging : ''].filter(String).join('｜')) + '</div>' +
        (t.note ? '<div class="meta">' + esc(t.note) + '</div>' : '') +
        (ACT.works && !lodging ? '<div class="meta">' + (mine.length ? '已交 ' + mine.length + ' 則' + (mine.some(function (w) { return w.state === '待補文字'; }) ? '（有待補文字）' : '') : '還沒交') + '</div>' : '') +
        '</div>' + (ACT.role === 's' && ACT.canUpload && !lodging ? '<button class="sbtn pr" onclick="workForm(\'' + t.id + '\')">＋ 交作業</button>' : '') + '</div></div>';
    });
  });
  $('tabBody').innerHTML = h;
}

// ---------- 作業 ----------
function workCard(w, opts) {
  opts = opts || {};
  var t = taskOf(w.taskId);
  var h = '<div class="work"><b>第 ' + w.day + ' 天｜' + esc(taskTitle(t)) + '</b> <span class="badge ' + (STATE_BADGE[w.state] || '') + '">' + esc(w.state) + '</span>';
  h += '<div class="thumbs">' + (w.kind === '影片' ? w.files.map(function (f) { return '<div class="vt" onclick="playMedia(\'' + f + '\')">▶</div>'; }).join('')
    : (w.views.length ? w.views : w.files).map(function (f) { return '<img data-v="' + esc(f) + '" alt="" onclick="zoomView(this)">'; }).join('')) + '</div>';
  h += '<dl>' + SIX.filter(function (s) { return w[s[0]]; }).map(function (s) { return '<dt>' + s[1] + '</dt><dd>' + esc(w[s[0]]) + '</dd>'; }).join('') + '</dl>';
  if (w.comment) h += '<div class="comment">老師：' + esc(w.comment) + '</div>';
  if (opts.edit && w.state !== '隱藏') h += '<div style="margin-top:8px"><button class="sbtn" onclick="workForm(\'' + w.taskId + '\',\'' + w.id + '\')">修改</button> <button class="sbtn bad" onclick="delWork(\'' + w.id + '\')">刪除</button></div>';
  if (opts.review) h += '<div style="margin-top:8px"><textarea id="cm_' + w.id + '" placeholder="給學生的意見（家長也看得到）">' + esc(w.comment) + '</textarea>' +
    '<button class="sbtn pr" onclick="review(\'' + w.id + '\',{comment:$(\'cm_' + w.id + '\').value})">儲存意見</button> ' +
    (w.state === '隱藏' ? '<button class="sbtn" onclick="review(\'' + w.id + '\',{hide:false})">恢復顯示</button>' : '<button class="sbtn bad" onclick="review(\'' + w.id + '\',{hide:true})">隱藏</button>') + '</div>';
  return h + '</div>';
}
function drawWorks() {
  var ws = ACT.works || [];
  var order = {}; ACT.itinerary.forEach(function (t, i) { order[t.id] = i; });
  ws = ws.slice().sort(function (a, b) { return a.day - b.day || (order[a.taskId] || 0) - (order[b.taskId] || 0); });
  var h = ACT.role === 's' && ACT.canUpload ? '<p class="muted">到「行程」找到任務，按「＋ 交作業」上傳。只有你自己、你的家長和老師看得到。</p>' : '';
  if (ACT.role === 'p') h = '<p class="muted">這裡是孩子在這次活動交的作業，只有您、孩子和老師看得到。</p>';
  h += ws.length ? ws.map(function (w) { return workCard(w, { edit: ACT.role === 's' && ACT.canUpload }); }).join('') : '<div class="card muted">還沒有作業。</div>';
  $('tabBody').innerHTML = h;
}
function delWork(id) {
  if (!confirm('確定刪除這則作業？')) return;
  api('deleteWork', [TOKEN, ACT.act.id, id], reloadAct);
}

/** 交作業表單：新增（taskId）或修改（workId）。 */
function workForm(taskId, workId) {
  var t = taskOf(taskId), w = workId ? (ACT.works || []).filter(function (x) { return x.id === workId; })[0] : null;
  var hint = t.hints || {};
  var pre = { when: w ? w.when : (t.date || ''), where: w ? w.where : [t.city, t.spot].filter(String).join(' '), who: w ? w.who : '', what: w ? w.what : '', why: w ? w.why : '', how: w ? w.how : '', find: w ? w.find : '' };
  var ph = { who: hint.who, what: hint.what || '發生了什麼事？看到了什麼？', why: hint.why || '為什麼會這樣？為什麼重要？', how: hint.how, find: hint.find || '我學到或發現了什麼？' };
  var h = '<h2>' + (w ? '修改作業' : '交作業') + '</h2><div class="muted">第 ' + t.day + ' 天｜' + esc(taskTitle(t)) + '</div>';
  if (!w) h += '<label class="f"><span>類型</span><select id="wfKind" onchange="$(\'wfFile\').accept=this.value===\'影片\'?\'video/*\':\'image/*\';$(\'wfFile\').multiple=this.value!==\'影片\'"><option>照片</option><option>影片</option></select></label>';
  h += '<label class="f"><span>' + (w ? '換檔案（不換就不用選）' : '選照片（最多 5 張）或 1 段影片') + '</span><input id="wfFile" type="file" accept="' + (w && w.kind === '影片' ? 'video/*' : 'image/*') + '"' + (w && w.kind === '影片' ? '' : ' multiple') + '></label>';
  h += SIX.map(function (s) { return '<label class="f"><span>' + s[1] + (['what', 'why', 'find'].indexOf(s[0]) >= 0 ? '（必填）' : '') + '</span><textarea id="wf_' + s[0] + '" rows="2" placeholder="' + esc(ph[s[0]] || '') + '">' + esc(pre[s[0]]) + '</textarea></label>'; }).join('');
  h += '<p class="muted">檔案傳完就會先存起來，文字可以之後再補；何事、為何、我的發現都寫了才算完成。</p>';
  h += '<div class="prog hidden" id="wfProg"><i></i></div><div class="muted" id="wfMsg"></div><div class="err" id="wfErr"></div>' +
    '<button class="btn pr" id="wfGo">儲存</button> <button class="btn" id="wfCancel" onclick="$(\'dlg\').close()">取消</button>';
  $('dlg').classList.add('wide'); $('dlgBody').innerHTML = h; $('dlg').showModal();
  $('wfGo').onclick = function () { saveWorkForm(t, w); };
}
async function saveWorkForm(t, w) {
  var files = Array.prototype.slice.call($('wfFile').files || []);
  var kind = w ? w.kind : $('wfKind').value;
  $('wfErr').textContent = '';
  if (!w && !files.length) { $('wfErr').textContent = '請先選檔案'; return; }
  if (kind === '照片' && files.length > 5) { $('wfErr').textContent = '最多 5 張照片'; return; }
  if (kind === '影片' && files.length > 1) { $('wfErr').textContent = '一次只能 1 段影片'; return; }
  if (files.some(function (f) { return kind === '影片' ? !/^video\//.test(f.type) : !/^image\//.test(f.type); })) { $('wfErr').textContent = '檔案類型不對'; return; }
  var rec = { id: w ? w.id : '', taskId: t.id, kind: kind, files: w ? w.files : [], views: w ? w.views : [] };
  SIX.forEach(function (s) { rec[s[0]] = $('wf_' + s[0]).value; });
  $('wfGo').disabled = true; $('wfCancel').disabled = true;
  try {
    if (files.length) {
      var up = await uploadFiles(files, kind, { type: 'work', taskId: t.id }, setProg('wf'));
      rec.files = up.files; rec.views = up.views;
    }
    $('wfMsg').textContent = '儲存文字…';
    await gasP('saveWork', [TOKEN, ACT.act.id, rec]);
    $('dlg').close(); $('dlg').classList.remove('wide');
    TAB = 'w'; reloadAct();
  } catch (e) {
    $('wfErr').textContent = e.message + '（可以再按一次儲存）'; $('wfGo').disabled = false; $('wfCancel').disabled = false;
  }
}
function setProg(p) {
  return function (frac, msg) { $(p + 'Prog').classList.remove('hidden'); $(p + 'Prog').firstChild.style.width = Math.round(frac * 100) + '%'; if (msg) $(p + 'Msg').textContent = msg; };
}

// ---------- 上傳 ----------
/** 照片：手機先縮成原圖（長邊 2048）與觀看版（長邊 1280）；影片原檔上傳。回傳 {files, views}。 */
async function uploadFiles(files, kind, target, prog) {
  var out = { files: [], views: [] }, n = files.length;
  for (var i = 0; i < n; i++) {
    var base = i / n, step = 1 / n, label = (n > 1 ? '第 ' + (i + 1) + '/' + n + ' 個檔案：' : '');
    if (kind === '影片') {
      out.files.push(await uploadBlob(target, '影片', files[i], '原檔', function (f) { prog(base + step * f, label + '上傳影片 ' + Math.round(f * 100) + '%'); }));
    } else {
      prog(base, label + '整理照片…');
      var big = await makeJpeg(files[i], 2048, 0.85), small = await makeJpeg(files[i], 1280, 0.75);
      if (small.size > 1400000) small = await makeJpeg(files[i], 1024, 0.6);
      out.files.push(await uploadBlob(target, '照片', big, '原檔', function (f) { prog(base + step * 0.8 * f, label + '上傳照片 ' + Math.round(f * 100) + '%'); }));
      out.views.push(await uploadBlob(target, '照片', small, '觀看版', function (f) { prog(base + step * (0.8 + 0.2 * f)); }));
    }
  }
  prog(1, '上傳完成');
  return out;
}
function makeJpeg(file, maxSide, q) {
  return new Promise(function (ok, fail) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, maxSide / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? ok(b) : fail(new Error('照片無法處理')); }, 'image/jpeg', q);
    };
    im.onerror = function () { URL.revokeObjectURL(url); fail(new Error('這張照片的格式手機無法處理，請改用一般照片（JPG）')); };
    im.src = url;
  });
}
/** 先試手機直接傳到雲端硬碟；不行就改由伺服器轉傳（較慢）。 */
async function uploadBlob(target, kind, blob, variant, prog) {
  var type = blob.type || (kind === '影片' ? 'video/mp4' : 'image/jpeg');
  var s = await gasP('startUpload', [TOKEN, ACT.act.id, target, kind, type, blob.size, variant, location.origin]);
  try {
    var id = await directPut(s, blob, prog);
    await gasP('confirmUpload', [TOKEN, s.uploadId, id]);
    return id;
  } catch (e) {
    console.warn('直傳失敗，改用轉傳', e);
    var s2 = await gasP('startUpload', [TOKEN, ACT.act.id, target, kind, type, blob.size, variant, '']);
    return relay(s2, blob, prog);
  }
}
async function directPut(s, blob, prog) {
  var start = 0;
  while (start < blob.size) {
    var end = Math.min(start + s.chunkSize, blob.size);
    var r = await fetch(s.sessionUri, { method: 'PUT', headers: { 'Content-Range': 'bytes ' + start + '-' + (end - 1) + '/' + blob.size }, body: blob.slice(start, end) });
    if (r.status === 308) { var rg = r.headers.get('Range'); start = rg ? Number(rg.split('-')[1]) + 1 : end; prog(start / blob.size); continue; }
    if (r.ok) { var j = await r.json(); prog(1); return j.id; }
    throw new Error('直傳失敗 ' + r.status);
  }
  throw new Error('直傳沒有完成');
}
async function relay(s, blob, prog, from) {
  var CH = 4 * 1024 * 1024, start = from || 0;
  while (start < blob.size) {
    var b64 = await toB64(blob.slice(start, Math.min(start + CH, blob.size)));
    var r = await gasP('uploadChunk', [TOKEN, s.uploadId, b64, start]);
    if (r.done) { prog(1); return r.fileId; }
    start = r.next || Math.min(start + CH, blob.size); prog(start / blob.size);
  }
  throw new Error('上傳沒有完成，請再試一次');
}
function toB64(b) { return new Promise(function (ok, fail) { var fr = new FileReader(); fr.onload = function () { ok(String(fr.result).split(',')[1]); }; fr.onerror = fail; fr.readAsDataURL(b); }); }

// ---------- 看檔 ----------
var VQ = 0;
/** 依序載入畫面上的觀看版圖片，同時最多 2 個請求。 */
function loadViews() {
  var imgs = document.querySelectorAll('img[data-v]:not([data-l])');
  Array.prototype.forEach.call(imgs, function (im) {
    var f = im.getAttribute('data-v');
    if (VCACHE[f]) { im.src = VCACHE[f]; im.setAttribute('data-l', '1'); }
  });
  if (VQ >= 2) return;
  var next = document.querySelector('img[data-v]:not([data-l])');
  if (!next || !ACT) return;
  next.setAttribute('data-l', '0'); VQ++;
  var f = next.getAttribute('data-v');
  api('getView', [TOKEN, ACT.act.id, f], function (u) { VQ--; VCACHE[f] = u; document.querySelectorAll('img[data-v="' + f + '"]').forEach(function (x) { x.src = u; x.setAttribute('data-l', '1'); }); loadViews(); },
    function () { VQ--; next.setAttribute('data-l', 'x'); next.alt = '無法顯示'; loadViews(); });
  loadViews();
}
function zoomView(im) { if (!im.src) return; $('lbVid').classList.add('hidden'); $('lbImg').classList.remove('hidden'); $('lbImg').src = im.src; $('lbCap').textContent = im.alt || ''; $('lb').style.display = 'flex'; }
async function playMedia(f) {
  $('busy').textContent = '讀取影片 0%'; $('busy').style.display = 'block';
  try {
    var parts = [], start = 0, mime = 'video/mp4';
    while (start >= 0) {
      var c = await gasP('getMediaChunk', [TOKEN, ACT.act.id, f, start]);
      parts.push(Uint8Array.from(atob(c.b64), function (ch) { return ch.charCodeAt(0); }));
      mime = c.mime; start = c.next;
      $('busy').textContent = '讀取影片 ' + (start < 0 ? 100 : Math.round(start / c.total * 100)) + '%';
    }
    var v = $('lbVid'); v.src = URL.createObjectURL(new Blob(parts, { type: mime }));
    $('lbImg').classList.add('hidden'); v.classList.remove('hidden'); $('lbCap').textContent = ''; $('lb').style.display = 'flex'; v.play();
  } catch (e) { alert(e.message); }
  $('busy').style.display = 'none'; $('busy').textContent = '稍等一下…';
}

  }

function mkLimit() { return MK.edit.type === '每日' ? MK.data.limits.dailySeconds : MK.data.limits.summarySeconds; }
function mkSave() { var e = MK.edit; mkStore(mkDraftKey(e), { sel: e.sel, title: e.title, music: e.music, res: e.res }); MK.result = null; $('meSend').classList.add('hidden'); }

function renderPicker() {

// ---------------- 裝置支援 ----------------

  var blob = await mkFetch('fileChunk', s.r, s.i), img;
  try {
    var bmp = await createImageBitmap(blob);
    img = mkShrink(bmp, bmp.width, bmp.height, 1600); if (bmp.close) bmp.close();

}
async function mkMusicBuffer(fileId) {
  if (!MK.music[fileId]) MK.music[fileId] = await (await mkFetch('musicChunk', fileId)).arrayBuffer();
  return MK.music[fileId];
}
/** 背景音樂：剪成影片長度，開頭 1 秒淡入、最後 2 秒淡出。 */
async function mkAudio(total, rate) {
  if (!MK.edit.music) return null;
  var raw = await mkMusicBuffer(MK.edit.music);
  var off = new OfflineAudioContext(2, Math.ceil(total * rate), rate);
  var src = await off.decodeAudioData(raw.slice(0));
  var s = off.createBufferSource(); s.buffer = src; s.loop = true;
  var g = off.createGain(), vol = 0.6;
  g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(vol, 1);
  g.gain.setValueAtTime(vol, Math.max(1, total - 2)); g.gain.linearRampToValueAtTime(0, total);
  s.connect(g); g.connect(off.destination); s.start(0);
  return off.startRendering();
}

// ---------------- 畫面 ----------------
function mkCover(g, img, W, H, scale, px, py) {
  var k = Math.max(W / img.width, H / img.height) * scale, w = img.width * k, h = img.height * k;
  g.drawImage(img, (W - w) / 2 + px * (w - W) / 2, (H - h) / 2 + py * (h - H) / 2, w, h);
}
function mkWrap(g, text, maxW) {
  var lines = [], cur = '';
  Array.from(text).forEach(function (ch) { if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch; });
  if (cur) lines.push(cur);
  return lines.slice(0, 2);
}
function mkTimeline(items) {
  var segs = [{ type: 'title', start: 0, dur: MK_TITLE }], t = MK_TITLE;
  items.forEach(function (it, i) { segs.push({ type: 'photo', it: it, i: i, start: t, dur: it.sec }); t += it.sec; });
  return { segs: segs, total: t + MK_FADE };
}
function mkSeg(g, W, H, seg, t, alpha, title, sub) {
  if (alpha <= 0) return;
  g.globalAlpha = alpha;
  if (seg.type === 'title') {
    g.fillStyle = '#16303f'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 ' + Math.round(H * .08) + 'px ' + MK_FONT; g.fillText(title, W / 2, H * .46);
    g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '400 ' + Math.round(H * .045) + 'px ' + MK_FONT; g.fillText(sub, W / 2, H * .58);
  } else {
    var p = Math.min(1, Math.max(0, (t - seg.start) / (seg.dur + MK_FADE))), dir = seg.i % 4;
    var sc = dir % 2 ? 1.12 - .1 * p : 1.02 + .1 * p;
    var px = [-.6, .6, 0, -.3][dir] * (p - .5), py = [0, -.3, .5, .3][dir] * (p - .5);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    mkCover(g, seg.it.img, W, H, sc, px, py);
    var cap = (seg.it.caption || '').trim();
    if (cap) {
      var fs = Math.round(H * .05); g.font = '600 ' + fs + 'px ' + MK_FONT;
      var lines = mkWrap(g, cap, W * .86), lh = fs * 1.35, boxH = lines.length * lh + fs * .9, y0 = H - boxH - H * .04;
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, y0, W, boxH);
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
      lines.forEach(function (l, k) { g.fillText(l, W / 2, y0 + fs * .45 + lh * (k + .5)); });

}
function mkFrame(g, W, H, tl, t, title, sub) {
  var segs = tl.segs, i = segs.length - 1;
  for (var k = 0; k < segs.length; k++) if (t < segs[k].start + segs[k].dur) { i = k; break; }
  var s = segs[i], end = s.start + s.dur;
  mkSeg(g, W, H, s, t, 1, title, sub);
  if (i + 1 < segs.length && t > end - MK_FADE) mkSeg(g, W, H, segs[i + 1], t, (t - (end - MK_FADE)) / MK_FADE, title, sub);
  if (i === segs.length - 1 && t > end) { g.fillStyle = 'rgba(0,0,0,' + Math.min(1, (t - end) / MK_FADE) + ')'; g.fillRect(0, 0, W, H); }
}

// ---------------- 編碼 ----------------
async function mkEncodeA(W, H, tl, g, title, sub) {
  var vc = await mkVideoCodec(W, H);
  if (!vc) throw new Error('NO_A');
  var ac = MK.edit.music ? await mkAudioCodec() : null, audio = null;
  if (ac) { $('meStatus').textContent = '準備音樂…'; audio = await mkAudio(tl.total, ac.rate); }
  var muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: vc.mux, width: W, height: H, frameRate: MK_FPS },
    audio: audio ? { codec: ac.mux, numberOfChannels: 2, sampleRate: ac.rate } : undefined,
    fastStart: 'in-memory', firstTimestampBehavior: 'offset'
  });
  var err = null;
  var ve = new VideoEncoder({ output: function (c, m) { muxer.addVideoChunk(c, m); }, error: function (e) { err = e; } });
  ve.configure({ codec: vc.codec, width: W, height: H, bitrate: W >= 1280 ? 2500000 : 1200000, framerate: MK_FPS });
  var N = Math.round(tl.total * MK_FPS);
  for (var f = 0; f < N; f++) {
    if (err) throw err;
    mkFrame(g, W, H, tl, f / MK_FPS, title, sub);
    var fr = new VideoFrame(g.canvas, { timestamp: Math.round(f * 1e6 / MK_FPS), duration: Math.round(1e6 / MK_FPS) });
    ve.encode(fr, { keyFrame: f % (MK_FPS * 2) === 0 }); fr.close();
    while (ve.encodeQueueSize > 8) await sleep(4);
    if (f % 10 === 0) { $('meProg').value = f / N; $('meStatus').textContent = '製作中… ' + Math.round(f / N * 100) + '%'; await sleep(0); }
  }
  await ve.flush(); ve.close();
  if (err) throw err;
  if (audio) {
    var ae = new AudioEncoder({ output: function (c, m) { muxer.addAudioChunk(c, m); }, error: function (e) { err = e; } });
    ae.configure({ codec: ac.codec, sampleRate: ac.rate, numberOfChannels: 2, bitrate: 96000 });
    var L = audio.getChannelData(0), R = audio.getChannelData(1), CH = 1024;
    for (var i = 0; i < L.length; i += CH) {
      var n = Math.min(CH, L.length - i), data = new Float32Array(n * 2);
      data.set(L.subarray(i, i + n), 0); data.set(R.subarray(i, i + n), n);
      var ad = new AudioData({ format: 'f32-planar', sampleRate: ac.rate, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / ac.rate), data: data });
      ae.encode(ad); ad.close();
      if ((i / CH) % 200 === 0) await sleep(0);
    }
    await ae.flush(); ae.close();
    if (err) throw err;
  }
  muxer.finalize();
  return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), mime: 'video/mp4', note: MK.edit.music && !ac ? '這支手機無法加入音樂，已做成無聲影片。' : '' };
}

async function mkEncodeB(W, H, tl, g, actx, title, sub) {
  var type = mkRecorderType();
  if (!type) throw new Error('這支手機的瀏覽器不支援做影片，請改用其他手機或平板。');
  var tracks = g.canvas.captureStream(MK_FPS).getVideoTracks(), srcNode = null;
  if (MK.edit.music && actx) {
    var buf = await mkAudio(tl.total, actx.sampleRate), dest = actx.createMediaStreamDestination();
    srcNode = actx.createBufferSource(); srcNode.buffer = buf; srcNode.connect(dest);
    tracks = tracks.concat(dest.stream.getAudioTracks());
  }
  var rec = new MediaRecorder(new MediaStream(tracks), { mimeType: type, videoBitsPerSecond: W >= 1280 ? 2500000 : 1200000 });
  var chunks = [], done = new Promise(function (r) { rec.onstop = r; });
  rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
  mkFrame(g, W, H, tl, 0, title, sub);
  rec.start(1000);
  var t0 = actx.currentTime + 0.05;
  if (srcNode) srcNode.start(t0);
  await new Promise(function (resolve) {
    function tick() {
      var t = actx.currentTime - t0;
      mkFrame(g, W, H, tl, Math.max(0, t), title, sub);
      $('meProg').value = Math.min(1, t / tl.total);
      $('meStatus').textContent = '錄製中… ' + Math.max(0, t).toFixed(0) + '／' + tl.total.toFixed(0) + ' 秒，請保持這個畫面';
      if (t >= tl.total) resolve(); else requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
  rec.stop(); await done;
  tracks.forEach(function (t) { t.stop(); });
  var mime = type.indexOf('video/mp4') === 0 ? 'video/mp4' : 'video/webm';
  return { blob: new Blob(chunks, { type: mime }), mime: mime, note: '' };
}

document.getElementById('meMake').onclick = async function () {
  var e = MK.edit, lim = MK.data.limits;

  if (e.sel.length < lim.minPhotos) { msg('meMsg', '至少選 ' + lim.minPhotos + ' 張照片'); return; }
  if (mkSeconds() > mkLimit()) { msg('meMsg', '影片太長，最多 ' + mkLimit() + ' 秒，請減少照片或每張秒數'); return; }
  var diag = await mkCheck();

  if (!useA && !diag.b) return;

    $('meSend').classList.remove('hidden');
  } catch (er) {
    msg('meMsg', '製作失敗：' + (er && er.message === 'NO_A' ? '這支手機不支援快速製作，請改選「省流量」畫質再試。' : (er && er.message || er)));
  } finally {

// ---------------- 送出 ----------------
async function mkUpload(blob, mime) {
  var s = await run('startUpload', S.token, ACT.act.id, { type: 'video' }, '影片', mime, blob.size, '原檔', location.origin);
  var total = blob.size, start = 0, fails = 0;
  var prog = function (p) { $('meProg').value = p; $('meStatus').textContent = '上傳中… ' + Math.round(p * 100) + '%'; };
  while (start < total) {
    var end = Math.min(start + s.chunkSize, total) - 1;
    try {
      var res = await fetch(s.sessionUri, { method: 'PUT', headers: { 'Content-Range': 'bytes ' + start + '-' + end + '/' + total }, body: blob.slice(start, end + 1) });
      if (res.status === 308) { var rg = res.headers.get('Range'); start = rg ? Number(rg.split('-')[1]) + 1 : end + 1; }
      else if (res.ok) { var fileId = (await res.json()).id; await run('confirmUpload', S.token, s.uploadId, fileId); prog(1); return fileId; }
      else throw new Error('HTTP ' + res.status);
      fails = 0; prog(start / total);
    } catch (er) {
      if (++fails >= 3) return uploadViaServer(s, blob, start, prog);
      await sleep(2000 * fails);
    }
  }
}

        '<label class="f"><span>' + (role === 'p' ? '孩子的座號' : '座號') + '</span><select id="lfS"></select></label>';
    }
    h += '<label class="f"><span>' + (role === 'p' ? '孩子的密碼' : '密碼') + '</span><input id="lfPw" type="password" autocomplete="current-password"' + (role === 't' ? '' : ' inputmode="numeric" maxlength="8"') + '></label>' +
      '<div class="err" id="lfErr"></div><button class="btn pr" style="background:var(--' + role + ');border-color:var(--' + role + ');color:#fff" id="lfGo" onclick="doLogin(\'' + role + '\')">登入</button> <button class="btn" onclick="$(\'dlg\').close()">取消</button>';
    $('lfBody').outerHTML = h;
    if (role !== 't') fillClasses();
    $('lfPw').onkeydown = function (e) { if (e.key === 'Enter') doLogin(role); };
  }, function (m) { $('lfBody').textContent = m; });
}
function reloadRoster(role) { api('getLoginOptions', [role, $('lfY').value], function (o) { OPT = o; fillClasses(); }); }
function fillClasses() {
  var cls = Object.keys(OPT.classes || {}).sort();
  $('lfC').innerHTML = cls.length ? cls.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') : '<option value="">（沒有參加名單）</option>';
  fillSeats();
}
function fillSeats() {
  var list = (OPT.classes || {})[$('lfC').value] || [];
  $('lfS').innerHTML = list.map(function (s) { return '<option value="' + esc(s.seat) + '">' + esc(Number(s.seat) + ' 號 ' + s.name) + '</option>'; }).join('');
}
function doLogin(role) {
  var who = role === 't' ? { teacherId: $('lfT').value } : { year: $('lfY').value, cls: $('lfC').value, seat: $('lfS').value };
  $('lfGo').disabled = true; $('lfErr').textContent = '';
  api('login', [role, who, $('lfPw').value], function (r) {
    TOKEN = r.token; store('ax_token', TOKEN); $('dlg').close(); showMe(r.me);
  }, function (m) { $('lfErr').textContent = m; $('lfGo').disabled = false; });
}
function logout(silent) {
  if (!silent && !confirm('確定要登出？')) return;
  if (ACT) closeAct();
  TOKEN = ''; ME = null; store('ax_token', null);
  document.body.className = ''; $('mine').classList.add('hidden'); $('btnLogin').textContent = '登入';
}

// ---------- 登入後 ----------
function showMe(me) {
  ME = me; ROLE = me.role;
  document.body.className = 'r-' + me.role;
  $('btnLogin').textContent = '登出';
  var who = me.role === 't' ? esc(me.name) + ' 老師' : (me.role === 'p' ? esc(me.name) + ' 的家長' : esc(me.name) + (me.cls ? '（' + esc(me.cls) + ' 班）' : ''));
  var h = '<div class="rolebar"><b>' + ROLE_NAME[me.role] + '｜' + who + '</b>' + (me.role === 't' ? '<button onclick="pwForm()">改密碼</button>' : '') + '<button onclick="logout()">登出</button></div>';
  h += '<h2>' + (me.role === 't' ? '我負責的活動' : me.role === 'p' ? '孩子參加的國際交流' : '我參加的國際交流') + '</h2>';
  h += me.acts.length ? me.acts.map(function (a) {
    var o = a.mode === '線上';
    return '<div class="card act' + (o ? ' o' : '') + '"><span class="tag' + (o ? ' o' : '') + '">' + esc(a.year) + ' 學年度｜' + esc(a.mode) + '交流</span>' + (a.state !== '進行中' ? ' <span class="tag g">' + esc(a.state) + '</span>' : '') +
      '<h3 style="margin:6px 0 2px">' + esc(a.name) + '</h3><div class="muted">' + esc(a.schools.join('、')) + '｜' + esc(a.start) + '～' + esc(a.end) +
      (a.group ? '｜第 ' + esc(a.group) + ' 組' : '') + (a.role ? '｜' + esc(a.role) : '') + '</div>' +
      (me.role !== 't' && a.keepUntil ? '<div class="muted">可查看到 ' + esc(a.keepUntil) + '</div>' : '') +
      (o ? '<p class="muted" style="margin-bottom:0">線上交流內容即將開放。</p>' : '<p style="margin:8px 0 0"><button class="sbtn pr" onclick="openAct(\'' + esc(a.id) + '\')">進入活動 →</button></p>') + '</div>';
  }).join('') : '<div class="card muted">目前沒有活動。</div>';
  $('mine').innerHTML = h; $('mine').classList.remove('hidden');
  window.scrollTo(0, 0);
}
function pwForm() {
  $('dlgBody').innerHTML = '<h2>修改密碼</h2><label class="f"><span>原密碼</span><input id="pwOld" type="password"></label><label class="f"><span>新密碼（8～32 碼）</span><input id="pwNew" type="password"></label><div class="err" id="pwErr"></div>' +
    '<button class="btn pr" onclick="api(\'changeTeacherPassword\',[TOKEN,$(\'pwOld\').value,$(\'pwNew\').value],function(t){TOKEN=t;store(\'ax_token\',t);$(\'dlg\').close();alert(\'已修改\');},function(m){$(\'pwErr\').textContent=m;})">儲存</button> <button class="btn" onclick="$(\'dlg\').close()">取消</button>';
  $('dlg').showModal();
}

$('dlg').addEventListener('close', function () { $('dlg').classList.remove('wide'); });

// ---------- 啟動 ----------
loadHome(START_YEAR);
TOKEN = load('ax_token') || '';
if (TOKEN) api('getMe', [TOKEN], showMe, function () { logout(true); });
else if (START_ROLE) setTimeout(function () { openLogin(START_ROLE); }, 300);

// ---------- 第 1 步測試工具 ----------
function runLoad(n) {
  var ms = Number($('ms').value) || 0, out = $('loadOut'), done = 0, ok = [], errs = {}, t0 = Date.now();
  out.innerHTML = '<p>送出 ' + n + ' 個請求中…</p>';
  function finish() {
    if (++done < n) return;
    var maxC = 0;
    ok.forEach(function (a) { var c = ok.filter(function (b) { return b.start < a.end && b.end > a.start; }).length; if (c > maxC) maxC = c; });
    var w = ok.map(function (r) { return r.rtt; }).sort(function (a, b) { return a - b; });
    out.innerHTML = '<p>成功 ' + ok.length + ' / ' + n + '，失敗 ' + (n - ok.length) + '，伺服器上最多同時執行 ' + maxC + '，等待中位數 ' + (w.length ? (w[Math.floor(w.length / 2)] / 1000).toFixed(1) : '-') + ' 秒、最長 ' + (w.length ? (w[w.length - 1] / 1000).toFixed(1) : '-') + ' 秒，全部 ' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒</p>' +
      Object.keys(errs).map(function (k) { return '<p style="color:var(--bad)">' + esc(k) + '（' + errs[k] + ' 次）</p>'; }).join('');
  }
  for (var i = 0; i < n; i++) (function () {
    var s = Date.now();
    google.script.run.withSuccessHandler(function (r) { r.rtt = Date.now() - s; ok.push(r); finish(); })
      .withFailureHandler(function (e) { var m = (e && e.message) || String(e); errs[m] = (errs[m] || 0) + 1; finish(); }).probe(ms);
  })();
}
function showShare() {
  var id = $('fid').value.trim(); if (!/^[\w-]{20,80}$/.test(id)) { alert('檔案 ID 格式不對'); return; }
  var urls = [['縮圖網址 A（lh3）', 'https://lh3.googleusercontent.com/d/' + id + '=w400'], ['縮圖網址 B（drive thumbnail）', 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400']];
  $('shareOut').innerHTML = '';
  urls.forEach(function (u, i) {
    var div = document.createElement('div'); div.innerHTML = '<p><b>' + u[0] + '</b>：<span id="st' + i + '">載入中…</span></p>';
    var im = new Image(); im.style.maxWidth = '100%'; im.referrerPolicy = 'no-referrer';
    im.onload = function () { $('st' + i).innerHTML = '<span style="color:var(--ok)">看得到 ✓</span>'; };
    im.onerror = function () { $('st' + i).innerHTML = '<span style="color:var(--bad)">看不到 ✗</span>'; };
    im.src = u[1]; div.appendChild(im); $('shareOut').appendChild(div);
  });
}

</script>
